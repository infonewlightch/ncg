<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>NCG contact form</title></head><body>
<!-- Netlify detects these fields at deploy time for the React contact form. -->
<form name="ncg-contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
<input type="hidden" name="form-name" value="ncg-contact">
<input name="category"><input name="name"><input name="email" type="email">
<textarea name="message"></textarea><input name="language"><input name="website">
</form>
</body></html>
