[build]
  command = "node scripts/check-hosting-config.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hosting remains a development preview until account, provider and church-content
# checks in docs/implementation-plan.md have been completed.

[functions."bible-translation"]
  included_files = ["public/bibles/webp/*.json"]

[functions."education-translation"]
  included_files = ["public/quizzes/en.json"]
